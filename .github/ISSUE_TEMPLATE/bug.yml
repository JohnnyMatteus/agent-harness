name: Bug
description: Algo não funciona como o esperado
labels: [bug]
body:
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Comandos, payloads (sem segredos) e versão.
    validations:
      required: true

name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration"

  integracao:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Imagem do sandbox, rede interna e proxy de saída
        shell: bash
        run: infra/sandbox/preparar.sh 2>&1 | tee "$RUNNER_TEMP/preparar.txt"
      - name: Testes de integração
        shell: bash
        run: uv run pytest -m integration 2>&1 | tee "$RUNNER_TEMP/pytest.txt"
      - name: Diagnóstico (anotações)
        if: failure()
        shell: bash
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/docker-ps.txt" 2>&1 || true
          docker logs --tail 40 forja-egress-proxy > "$RUNNER_TEMP/proxy.txt" 2>&1 || true
          python3 infra/ci/anotar.py integracao \
            "pytest=$RUNNER_TEMP/pytest.txt" "preparar=$RUNNER_TEMP/preparar.txt" \
            "proxy=$RUNNER_TEMP/proxy.txt" "containers=$RUNNER_TEMP/docker-ps.txt"

  evals-regressao:
    # Regressão DETERMINÍSTICA do harness (sem modelo, sem secrets): zero tarefas, falha, erro ou
    # skip derrubam o job. Não mede qualidade de agente.
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Evals de regressão
        run: uv run pytest -m eval_regressao tests/evals --junitxml="$RUNNER_TEMP/evals.xml"
      - name: Gate (zero tarefas, skip ou erro é falha)
        if: always()
        run: python3 infra/ci/verificar_evals.py "$RUNNER_TEMP/evals.xml" 30

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose --profile core --profile observability config -q

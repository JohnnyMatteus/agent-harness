name: forja

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-forja}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [forja]
    profiles: [core]

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [forja]
    profiles: [core]

  # Servidor de desenvolvimento: SQLite em volume, UI embutida. Em produção seria o cluster Temporal.
  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [forja]
    profiles: [core]

  # Traces de LLM e do harness (ADR 0010). Langfuse exigiria ClickHouse, Redis e S3 próprios.
  phoenix:
    image: arizephoenix/phoenix:version-22.0.1
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_OTLP_PORT:-4317}:4317"
    volumes:
      - phoenix-data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:6006/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [forja]
    profiles: [observability]

volumes:
  postgres-data:
  redis-data:
  temporal-data:
  phoenix-data:

networks:
  forja:
    name: forja-net

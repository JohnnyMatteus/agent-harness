[project]
name = "forja"
version = "0.1.0"
description = "Forja: harness autônomo de engenharia com RAG"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.12.0",
    "claude-agent-sdk>=0.2.187",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "temporalio>=1.36.1",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "cryptography>=43",
    "fakeredis>=2.24",
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "respx>=0.21",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: precisa de Docker (testcontainers); roda só no CI"]

[tool.pyright]
include = ["forja", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
